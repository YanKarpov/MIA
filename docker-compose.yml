version: "3.9"

services:

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    environment:
      EULA: "true"
      TYPE: "PAPER"
    ports:
      - "25565:25565"
    volumes:
      - ./minecraft/plugins:/data/plugins
      - ./minecraft/world:/data/world
    depends_on:
      - ml
      - db
    networks:
      - net

  ml:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - net

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quests
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - net

networks:
  net:
    driver: bridge
