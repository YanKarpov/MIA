version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-quests}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-quests}"]
      interval: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-dev
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: ${MINECRAFT_VERSION:-1.21.11}
      MEMORY: ${MINECRAFT_MEMORY:-2G}
      OPS: ${MINECRAFT_OPS:-LupusHex}
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    volumes:
      - ./minecraft/plugins:/data/plugins
      - ./minecraft/world:/data/world
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - DB_NAME=${POSTGRES_DB:-quests}
    volumes:
      - ./ml-service:/app
    networks:
      - net
    restart: unless-stopped

networks:
  net:
    driver: bridge