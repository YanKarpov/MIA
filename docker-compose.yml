version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quests
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quests"]
      interval: 5s
      retries: 5
      start_period: 5s

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-dev
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "1.21.11"          
      MEMORY: "2G"
      OPS: "LupusHex" 
    ports:
      - "25565:25565"
    volumes:
      - ./minecraft/plugins:/data/plugins
      - ./minecraft/world:/data/world
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net

  ml-service:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ml-service:/app   
    networks:
      - net

networks:
  net:
    driver: bridge