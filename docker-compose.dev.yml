version: "3.9"

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-dev
    environment:
      EULA: "true"
      TYPE: "PAPER"
      MEMORY: "2G"
    ports:
      - "25565:25565"
    volumes:
      - ./minecraft/plugins:/data/plugins
      - ./minecraft/world:/data/world