name: Test ML Service

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-ml:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd ml-service
        pip install -r requirements.txt

    - name: Test ML model loading
      run: |
        cd ml-service
        ls -la
        python test_model.py

    - name: Verify app structure
      run: |
        cd ml-service
        test -d app && echo "✓ app/ exists"
        test -f requirements.txt && echo "✓ requirements.txt exists"
        test -f model.pkl && echo "✓ model.pkl exists"

    - name: Try import app module
      run: |
        cd ml-service
        python -c "import app; print('✓ app module can be imported')"