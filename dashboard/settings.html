<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <span class="neon-glow">⚙️</span>
                </div>
                <div>
                    <h1>Minecraft <span class="gradient-text">Quest ML</span></h1>
                    <p class="subtitle">Настройки системы</p>
                </div>
            </div>
            <div id="status-container"></div>
        </header>

        <!--#include virtual="/components/navbar.html" -->


        <div class="card">
            <div class="card-header">
                <h2>Конфигурация ML-сервиса</h2>
                <button class="refresh-btn" id="saveSettingsBtn">💾 Сохранить</button>
            </div>
            <div class="card-body">
                <div class="setting-group">
                    <label class="setting-label">🤖 Порог ML модели</label>
                    <input type="range" id="mlThreshold" min="0" max="1" step="0.01" value="0.5" style="width: 100%;">
                    <span id="thresholdValue" style="display: inline-block; margin-top: 8px;">0.50</span>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Количество кандидатов</label>
                    <input type="number" id="candidatesCount" value="5" min="1" max="10" class="setting-input">
                </div>

                <div class="setting-group">
                    <label class="setting-label">Режим работы</label>
                    <select id="apiMode" class="setting-input">
                        <option value="real">Real API (ML сервис)</option>
                        <option value="demo">Demo Mode (локальные данные)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label class="setting-label">API Endpoint</label>
                    <input type="text" id="apiEndpoint" value="/api/rank" class="setting-input">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>О системе</h2>
            </div>
            <div class="card-body">
                <p><strong>Версия:</strong> 1.0.0</p>
                <p><strong>ML модель:</strong>MIA‑Rank</p>
                <p><strong>Дата сборки:</strong> Апрель 2025</p>
                <p><strong>Разработчик:</strong> Карпов Я.А.</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
