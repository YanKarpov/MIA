<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!--#include virtual="/components/header.html" -->

        <!--#include virtual="/components/navbar.html" -->

        <div class="main-grid">
            <div class="card ranking-panel">
                <div class="card-header">
                    <h2>ML Ранжирование</h2>
                    <button class="refresh-btn" id="refreshRankingBtn">Обновить</button>
                </div>
                <div class="card-body">
                    <div id="rankingTable" class="ranking-table">
                        <div style="padding: 40px; text-align: center">Загрузка...</div>
                    </div>
                    <div id="explanationBox" class="explanation-box"></div>
                </div>
            </div>

            <div class="card recent-panel">
                <div class="card-header">
                    <h2>Последние квесты</h2>
                    <span class="badge">Из БД</span>
                </div>
                <div class="card-body">
                    <div id="recentQuests" class="quest-list">
                        <div style="padding: 20px; text-align: center">Загрузка...</div>
                    </div>
                </div>
            </div>

            <div class="card players-panel">
                <div class="card-header">
                    <h2>👥 Игроки</h2>
                    <span class="badge">Статистика</span>
                </div>
                <div class="card-body">
                    <div id="playersTable" class="players-table">
                        <div style="padding: 20px; text-align: center">Загрузка...</div>
                    </div>
                </div>
            </div>

            <div class="card logs-panel">
                <div class="card-header">
                    <h2>Логи ML-сервиса</h2>
                    <button class="clear-btn" id="clearLogsBtn">Очистить</button>
                </div>
                <div class="card-body">
                    <div id="logsContainer" class="logs-container">
                        <div style="padding: 20px; text-align: center">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
